[project]
name = "embedding"
version = "0.1.0"
description = "FjordWatch embedding service: multilingual-e5-large embeddings over HTTP for the agent's RAG retrieval and ingestion."
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic-settings>=2.6,<3",
    "numpy>=2.1,<3",
    "structlog>=24.4,<25",
    "prometheus-fastapi-instrumentator>=7,<8",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<0.28",
    "tiktoken>=0.8,<1",
]

[project.optional-dependencies]
heavy = [
    # The real model is gated behind this extra so CI can skip it via
    # EMBEDDING_STUB=1.
    "sentence-transformers>=3.3,<4",
    "torch>=2.5,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<0.28",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "tiktoken.*", "prometheus_fastapi_instrumentator.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
