name: python

on:
  push:
    branches: [main]
    paths:
      - "services/anomaly-detection/**"
      - "services/sar-fetcher/**"
      - "services/ship-detection/**"
      - "services/embedding/**"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/anomaly-detection/**"
      - "services/sar-fetcher/**"
      - "services/ship-detection/**"
      - "services/embedding/**"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  anomaly-detection:
    name: anomaly-detection lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/anomaly-detection
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/anomaly-detection/pyproject.toml
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q

  sar-fetcher:
    name: sar-fetcher lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/sar-fetcher
    steps:
      - uses: actions/checkout@v4
      - name: Install GDAL system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libproj-dev libgeos-dev
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/sar-fetcher/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q

  ship-detection:
    name: ship-detection lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ship-detection
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/ship-detection/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q

  embedding:
    name: embedding lint + test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/embedding
    env:
      EMBEDDING_STUB: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            services/embedding/pyproject.toml
      - name: Install dependencies (stub mode; skip the heavy extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src
      - name: pytest
        run: pytest -q
