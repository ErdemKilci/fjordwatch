# FjordWatch local stack.
# Phase 0: only infrastructure (Postgres, Redis, MinIO, Ollama) and stub
# services. Real service images replace the stubs as each phase lands.
#
# Usage:
#   make env && make up
#
# Optional observability stack lives in docker-compose.observability.yml.

name: fjordwatch

x-stub: &stub
  image: busybox:1.36
  restart: unless-stopped
  command:
    - sh
    - -c
    - |
      echo "[$$(date -u +%FT%TZ)] $${SERVICE_NAME:-stub} ready"
      while true; do sleep 30; echo "[$$(date -u +%FT%TZ)] $${SERVICE_NAME:-stub} alive"; done
  healthcheck:
    test: ["CMD", "true"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  # ---- Infrastructure -----------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fjordwatch}
      POSTGRES_USER: ${POSTGRES_USER:-fjordwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fjordwatch_dev_only_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fjordwatch} -d $${POSTGRES_DB:-fjordwatch}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fjordwatch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fjordwatch_dev_only_change_me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:0.4.7
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---- Database migrations (one-shot Flyway) -----------------------------
  db-migrate:
    image: flyway/flyway:10-alpine
    restart: "no"
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fjordwatch}
      - -user=${POSTGRES_USER:-fjordwatch}
      - -password=${POSTGRES_PASSWORD:-fjordwatch_dev_only_change_me}
      - -connectRetries=30
      - -baselineOnMigrate=true
      - migrate
    volumes:
      - ./services/db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Backend services --------------------------------------------------
  ais-ingestion:
    build:
      context: ./services/ais-ingestion
      dockerfile: Dockerfile
    image: fjordwatch/ais-ingestion:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fjordwatch}:${POSTGRES_PASSWORD:-fjordwatch_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-fjordwatch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AIS_STREAM: ${AIS_STREAM:-ais:positions}
      AIS_SOURCE_HOST: ${AIS_SOURCE_HOST:-153.44.253.27}
      AIS_SOURCE_PORT: ${AIS_SOURCE_PORT:-5631}
      AIS_REPLAY_FILE: ${AIS_REPLAY_FILE:-}
      AIS_REPLAY_DELAY_MS: ${AIS_REPLAY_DELAY_MS:-0}
      AIS_BATCH_SIZE: ${AIS_BATCH_SIZE:-200}
      AIS_RECONNECT_INITIAL_BACKOFF_MS: ${AIS_RECONNECT_INITIAL_BACKOFF_MS:-500}
      AIS_RECONNECT_MAX_BACKOFF_MS: ${AIS_RECONNECT_MAX_BACKOFF_MS:-30000}
      AIS_METRICS_LISTEN: 0.0.0.0:9100
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,redis=info}
    ports:
      - "${AIS_METRICS_PORT:-9100}:9100"
    volumes:
      - ./services/ais-ingestion/tests/fixtures:/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    image: fjordwatch/core-api:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fjordwatch}:${POSTGRES_PASSWORD:-fjordwatch_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-fjordwatch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AIS_STREAM: ${AIS_STREAM:-ais:positions}
      ASPNETCORE_HTTP_PORTS: "8080"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      DOTNET_RUNNING_IN_CONTAINER: "true"
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  ship-detection:
    <<: *stub
    environment:
      SERVICE_NAME: ship-detection
    depends_on:
      minio:
        condition: service_healthy

  anomaly-detection:
    build:
      context: ./services/anomaly-detection
      dockerfile: Dockerfile
    image: fjordwatch/anomaly-detection:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-fjordwatch}:${POSTGRES_PASSWORD:-fjordwatch_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-fjordwatch}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODEL_DIR: /app/models
      ANOMALY_WINDOW_MINUTES: ${ANOMALY_WINDOW_MINUTES:-360}
      SCORER_INTERVAL_SECONDS: ${SCORER_INTERVAL_SECONDS:-600}
      MIN_POSITIONS_PER_WINDOW: ${MIN_POSITIONS_PER_WINDOW:-10}
      SCORE_FLOOR: ${SCORE_FLOOR:-0.05}
      ANOMALY_METRICS_PORT: "8002"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${ANOMALY_DETECTION_PORT:-8002}:8002"
    volumes:
      - anomaly-models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  sar-fetcher:
    <<: *stub
    environment:
      SERVICE_NAME: sar-fetcher
    depends_on:
      minio:
        condition: service_healthy

  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    image: fjordwatch/web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:8080"
    depends_on:
      core-api:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
  anomaly-models:

networks:
  default:
    name: fjordwatch
