global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: fjordwatch-local
    environment: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ais-ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["ais-ingestion:9100"]

  - job_name: core-api
    metrics_path: /metrics
    static_configs:
      - targets: ["core-api:8080"]

  - job_name: anomaly-detection
    metrics_path: /metrics
    static_configs:
      - targets: ["anomaly-detection:8002"]

  - job_name: ship-detection
    metrics_path: /metrics
    static_configs:
      - targets: ["ship-detection:8001"]

  - job_name: sar-fetcher
    metrics_path: /metrics
    static_configs:
      - targets: ["sar-fetcher:8003"]

  - job_name: embedding
    metrics_path: /metrics
    static_configs:
      - targets: ["embedding:8004"]
